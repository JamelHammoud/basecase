[workspace]
resolver = "2"
members = [
  "crates/servo-wire",
  "crates/plant-bam",
  "crates/servo-emu",
  "crates/faultbox",
  "crates/robot-daemon",
  "crates/transport-real",
  "crates/routine-soak",
]
exclude = ["coordinator"]
default-members = [
  "crates/servo-wire",
  "crates/plant-bam",
  "crates/servo-emu",
  "crates/faultbox",
  "crates/robot-daemon",
  "crates/routine-soak",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
opt-level = 3
debug = false
overflow-checks = true

[profile.test]
opt-level = 2
