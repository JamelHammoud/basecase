name: Nightly release

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release main if it changed and Check passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAUSED: ${{ vars.LOOP_PAUSED }}
        run: |
          [ "$PAUSED" = true ] && { echo "The loop is paused (LOOP_PAUSED)."; exit 0; }
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          last=$(gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          last_sha=$(gh api "repos/$REPO/commits/$last" --jq .sha)
          if [ "$head" = "$last_sha" ]; then echo "Nothing merged since $last."; exit 0; fi
          check=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=check" --jq '.check_runs[0].conclusion // "missing"')
          if [ "$check" != success ]; then echo "Check is $check on main ($head), so no release tonight."; exit 0; fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="$major.$minor.$((patch + 1))"
          echo "Releasing $next ($head, after $last)."
          gh workflow run release.yml -R "$REPO" --ref main -f version="$next" -f release=true
