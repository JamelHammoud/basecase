name: Check

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ros: ${{ steps.filter.outputs.ros }}
      ios: ${{ steps.filter.outputs.ios }}
      lerobot: ${{ steps.filter.outputs.lerobot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the packaged app, the ROS package, the iPhone app and LeRobot datasets need checking
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then printf 'app=true\nros=true\nios=true\nlerobot=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          pattern='^(electron/|forge/|hw/|build/|tools/forge/|tools/native/|e2e/app/|\.github/workflows/|package\.json$|package-lock\.json$|vitest\.app\.config\.ts$)'
          if grep -qE "$pattern" <<< "$files"; then echo "app=true"; else echo "app=false"; fi >> "$GITHUB_OUTPUT"
          ros='^(src/sim/|src/utils/robotImport/|src/utils/(kinematics|engineering|stlBytes|zipFolder)|src/types/robotics\.ts$|src/three/meshMeasure\.ts$|src/workspace/robotPackageExport\.ts$|src/reality/|src/robot/sceneRobot\.ts$|tools/ros/|\.github/workflows/check\.yml$|package-lock\.json$)'
          if grep -qE "$ros" <<< "$files"; then echo "ros=true"; else echo "ros=false"; fi >> "$GITHUB_OUTPUT"
          ios='^(ios/|e2e/fixtures/scanned-room\.json$|\.github/workflows/check\.yml$)'
          if grep -qE "$ios" <<< "$files"; then echo "ios=true"; else echo "ios=false"; fi >> "$GITHUB_OUTPUT"
          lerobot='^(src/datasets/|tools/lerobot/|\.github/workflows/check\.yml$|package-lock\.json$)'
          if grep -qE "$lerobot" <<< "$files"; then echo "lerobot=true"; else echo "lerobot=false"; fi >> "$GITHUB_OUTPUT"

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name != 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - name: Check only what the pull request changed
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npm run check:tracked
          npm run check:quarantine
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD)
          if [ "${#files[@]}" -eq 0 ]; then echo "Nothing changed to check."; exit 0; fi
          node tools/check-changed.mjs "${files[@]}"
      - name: Check everything
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run check
      - if: runner.os == 'Linux'
        run: npm audit --audit-level=high

  e2e:
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx vite build --mode web --outDir dist-web
      - run: npx vitest run --config vitest.e2e.config.ts --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Run quarantined tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        run: npm run test:quarantine

  e2e-changed:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the e2e tests the pull request added or changed
        id: files
        run: |
          found=$(node tools/e2e-changed.mjs HEAD^1)
          echo "$found"
          echo "list=$(jq -r '.files | join(" ")' <<< "$found")" >> "$GITHUB_OUTPUT"
          echo "pattern=$(jq -r '.pattern' <<< "$found")" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.files.outputs.pattern != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ steps.files.outputs.pattern != '' }}
        run: npm ci
      - if: ${{ steps.files.outputs.pattern != '' }}
        run: npx vite build && npx vite build --mode web --outDir dist-web
      - if: ${{ steps.files.outputs.pattern != '' }}
        env:
          FILES: ${{ steps.files.outputs.list }}
          PATTERN: ${{ steps.files.outputs.pattern }}
        run: |
          read -ra list <<< "$FILES"
          npx vitest run --config vitest.e2e.config.ts "${list[@]}" -t "$PATTERN"

  e2e-windows:
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx vite build --mode web --outDir dist-web
      - run: npx vitest run --config vitest.e2e.config.ts --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Run quarantined tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        run: npm run test:quarantine

  app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            forge
            hw
      - name: Build the Forge trainer and the robot daemon
        run: npm run build:forge && npm run build:daemon
      - name: Package the app, unsigned
        run: npx electron-builder ${{ matrix.target }} --dir --publish never -c.mac.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Drive the packaged app
        if: runner.os == 'macOS'
        run: npm run test:app
      - name: Compile parts in the packaged app's kernel sandbox
        if: runner.os == 'Windows'
        run: |
          BASECASE_KERNEL_SELFTEST="$RUNNER_TEMP/kernel.json" BASECASE_USER_DATA="$RUNNER_TEMP/user-data" STUDIO_AGENT_OFFLINE=1 timeout 300 release/win-unpacked/Basecase.exe
          cat "$RUNNER_TEMP/kernel.json"
      - name: Convert CAD files in the packaged app's sandbox
        if: runner.os == 'Windows'
        run: |
          if npx vitest run --config vitest.app.config.ts e2e/app/cadImportSandbox.app.test.ts; then exit 0; fi
          if [[ "$(date -u +%F)" < 2026-11-27 ]]; then
            echo "::warning::Quarantined until 2026-11-27 (#54): the packaged Windows app crashes in the CAD-import self-test."
            exit 0
          fi
          exit 1

  ros:
    needs: changes
    if: needs.changes.outputs.ros == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build every fixture robot's package with colcon in ros:jazzy and check its URDF
        run: node tools/ros/check.mjs

  lerobot:
    needs: changes
    if: needs.changes.outputs.lerobot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - name: Load an exported dataset with LeRobot at v3.0 and its v2.1 copy as GR00T reads it
        run: node tools/lerobot/check.mjs

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Basecase Scan for the simulator and run its XCTests
        run: sh ios/test.sh

  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No commit credits a model or tool
        env:
          RANGE: ${{ github.event_name == 'pull_request' && 'HEAD^1..HEAD^2' || format('{0}~1..{0}', github.sha) }}
        run: node tools/check-credit.mjs "$RANGE"

  copy:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'loop/batch/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: New copy is justified and uses no banned words
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-copy-budget.mjs HEAD^1..HEAD^2

  check:
    if: always()
    needs: [changes, unit, e2e, e2e-changed, e2e-windows, app, ros, ios, lerobot, credit, copy]
    runs-on: ubuntu-latest
    steps:
      - name: Pass only when every job that had to run passed
        env:
          REQUIRED: ${{ needs.changes.result }} ${{ needs.unit.result }} ${{ needs.credit.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_CHANGED: ${{ needs.e2e-changed.result }}
          FULL: ${{ github.event_name != 'pull_request' }}
          HEAD_REF: ${{ github.head_ref }}
          APP: ${{ needs.app.result }}
          APP_NEEDED: ${{ needs.changes.outputs.app }}
          ROS: ${{ needs.ros.result }}
          ROS_NEEDED: ${{ needs.changes.outputs.ros }}
          IOS: ${{ needs.ios.result }}
          IOS_NEEDED: ${{ needs.changes.outputs.ios }}
          LEROBOT: ${{ needs.lerobot.result }}
          LEROBOT_NEEDED: ${{ needs.changes.outputs.lerobot }}
          WINDOWS_E2E: ${{ needs.e2e-windows.result }}
          COPY: ${{ needs.copy.result }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          echo "Required: $REQUIRED; full: $FULL; e2e: $E2E; changed e2e: $E2E_CHANGED; app: $APP (needed: $APP_NEEDED); ROS: $ROS (needed: $ROS_NEEDED); iOS: $IOS (needed: $IOS_NEEDED); LeRobot: $LEROBOT (needed: $LEROBOT_NEEDED); Windows e2e: $WINDOWS_E2E; copy: $COPY"
          [ "$(wc -w <<< "$REQUIRED")" -eq 3 ] || exit 1
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          want_full=skipped
          [ "$FULL" = true ] && want_full=success
          [ "$E2E" = "$want_full" ] || exit 1
          [ "$WINDOWS_E2E" = "$want_full" ] || exit 1
          want_changed=success
          [ "$FULL" = true ] && want_changed=skipped
          [ "$E2E_CHANGED" = "$want_changed" ] || exit 1
          want_app=skipped
          [ "$FULL" = true ] && [ "$APP_NEEDED" = true ] && want_app=success
          [ "$APP" = "$want_app" ] || exit 1
          want_ros=success
          [ "$ROS_NEEDED" = true ] || want_ros=skipped
          [ "$ROS" = "$want_ros" ] || exit 1
          want_ios=success
          [ "$IOS_NEEDED" = true ] || want_ios=skipped
          [ "$IOS" = "$want_ios" ] || exit 1
          want_lerobot=success
          [ "$LEROBOT_NEEDED" = true ] || want_lerobot=skipped
          [ "$LEROBOT" = "$want_lerobot" ] || exit 1
          want_copy=skipped
          [ "$EVENT" = pull_request ] && [[ "$HEAD_REF" != loop/batch/* ]] && want_copy=success
          [ "$COPY" = "$want_copy" ] || exit 1
