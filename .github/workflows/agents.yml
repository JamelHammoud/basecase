name: Agents

# Interim (plan, Phase 0a step 1): a manual dry run only. The daily bump moves to
# Renovate in the workshop organization (after the Phase 0b spike), landed by the merger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci

      - name: Move the agent adapters to their latest releases
        id: bump
        run: |
          npm install --min-release-age=0 @agentclientprotocol/claude-agent-acp@latest @agentclientprotocol/codex-acp@latest @google/gemini-cli@latest
          if git diff --quiet package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          summary=$(node -p "['@agentclientprotocol/claude-agent-acp','@agentclientprotocol/codex-acp','@google/gemini-cli'].map((p) => p.split('/')[1] + ' ' + require('./node_modules/' + p + '/package.json').version).join(', ')")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.changed == 'true'
        run: npm run typecheck
      - name: Test the code that starts and talks to the agents
        if: steps.bump.outputs.changed == 'true'
        run: npx vitest run electron/backend
      - if: steps.bump.outputs.changed == 'true'
        run: npx vite build

      - if: steps.bump.outputs.changed == 'true'
        run: npm audit signatures
