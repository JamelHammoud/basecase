[package]
name = "basecase-coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
missing_safety_doc = "allow"
