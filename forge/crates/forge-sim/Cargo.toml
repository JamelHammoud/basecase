[package]
name = "forge-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "forge-sim"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:forge-metal", "dep:forge-wgpu", "dep:forge-mujoco", "dep:rayon", "forge-ir/mujoco"]

[dependencies]
forge-ir = { path = "../forge-ir", default-features = false }
forge-metal = { path = "../forge-metal", optional = true }
forge-wgpu = { path = "../forge-wgpu", optional = true }
forge-mujoco = { path = "../forge-mujoco", optional = true }
rayon = { version = "1", optional = true }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
needless_range_loop = "allow"
