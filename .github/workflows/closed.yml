name: Closed

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Cancelled Check for pull request ${{ github.event.pull_request.number }}"
