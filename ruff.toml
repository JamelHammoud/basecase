line-length = 120
extend-exclude = ["library", "vendor", "node_modules", "electron/trainer/.venv", "electron/simready/.venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PLR", "ERA"]
ignore = ["PLR2004"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-args = 4
max-branches = 15
max-statements = 60
