[package]
name = "forge-train"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "forge-train"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:forge-mujoco", "dep:rayon", "forge-sim/native", "forge-ir/mujoco"]

[dependencies]
forge-ir = { path = "../forge-ir", default-features = false }
forge-mujoco = { path = "../forge-mujoco", optional = true }
forge-sim = { path = "../forge-sim", default-features = false }
forge-reward = { path = "../forge-reward" }
rayon = { version = "1", optional = true }
serde_json = "1"
