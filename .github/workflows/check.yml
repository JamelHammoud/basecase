name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm audit --audit-level=high

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build the Forge trainer
        run: rustup toolchain install stable --profile minimal && npm run build:forge
      - name: Package the app, unsigned
        run: npx electron-builder ${{ matrix.target }} --dir --publish never -c.mac.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Drive the packaged app
        if: runner.os == 'macOS'
        run: npm run test:app
      - name: Compile parts in the packaged app's kernel sandbox
        if: runner.os == 'Windows'
        run: |
          BASECASE_KERNEL_SELFTEST="$RUNNER_TEMP/kernel.json" BASECASE_USER_DATA="$RUNNER_TEMP/user-data" STUDIO_AGENT_OFFLINE=1 timeout 300 release/win-unpacked/Basecase.exe
          cat "$RUNNER_TEMP/kernel.json"
