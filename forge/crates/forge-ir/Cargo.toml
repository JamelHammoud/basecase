[package]
name = "forge-ir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["mujoco"]
mujoco = ["dep:forge-mujoco"]

[dependencies]
forge-mujoco = { path = "../forge-mujoco", optional = true }
forge-reward = { path = "../forge-reward" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
