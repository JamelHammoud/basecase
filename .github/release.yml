changelog:
  exclude:
    labels:
      - loop:repair
      - loop:lesson
      - loop:loop
      - loop:update
      - loop:market
  categories:
    - title: New
      labels:
        - loop:feature
        - loop:integration
    - title: Better
      labels:
        - loop:refine
        - loop:harness
    - title: Fixed
      labels:
        - loop:fix
    - title: Everything else
      labels:
        - '*'
