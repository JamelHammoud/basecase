[package]
name = "forge-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
forge-ir = { path = "../forge-ir", default-features = false }
forge-sim = { path = "../forge-sim", default-features = false }
forge-train = { path = "../forge-train", default-features = false }
serde_json = "1"

[lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
