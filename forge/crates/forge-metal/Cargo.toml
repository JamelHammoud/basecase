[package]
name = "forge-metal"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "MTLDevice",
  "MTLBuffer",
  "MTLResource",
  "MTLLibrary",
  "MTLCommandQueue",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLTypes",
  "MTLAllocation",
  "objc2-core-foundation",
] }

[lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
