feetech:
  - behaviour: Packets are FF FF, id, length, instruction or error, params, then ~(sum of id..params) & 0xFF.
    source: client-derived
    note: scservo_sdk protocol_packet_handler txPacket and rxPacket; the unmodified SDK passes against the emulator.
  - behaviour: Status error bits are voltage 1, angle sensor 2, overheat 4, overcurrent 8, overload 32.
    source: client-derived
    note: scservo_sdk ERRBIT_* constants. Bit 16 is never set by the emulator.
  - behaviour: Model number 777 sits at address 3 as a little-endian word.
    source: client-derived
    note: rustypot sts3215.rs (model at 3) and scservo_sdk ping, which reads address 3 after a ping.
  - behaviour: Register addresses (torque 40, goal 42, goal speed 46, torque limit 48, lock 55, present block 56 to 70).
    source: client-derived
    note: rustypot src/servo/feetech/sts3215.rs.
  - behaviour: Factory defaults (max temperature 70, voltage window 4.0 to 8.0 V, torque limit 1000, P gain 32, protection current 500, protective torque 20, protection time 200, overload torque 80, overcurrent time 200, unloading conditions 44).
    source: assumed
    note: Recalled from Feetech's memory table, not read from a document in this session. Check them in the Stage 8 register dump.
  - behaviour: Overload (load at or above Overload Torque for Protection Time) unloads the output to Protective Torque, 20% by default, and sets status bit 32.
    source: datasheet
    note: STS3215 datasheet behaviour as stated in the build brief; the datasheet itself was not re-read here. Load is modelled as duty cycle over its maximum.
  - behaviour: Overcurrent (current at or above Protection Current for Over-current Protection Time) cuts output to zero and sets status bit 8.
    source: datasheet
    note: As stated in the build brief. The 6.5 mA per unit current scale is assumed.
  - behaviour: Both protections clear on a new command, a write to goal position, time or speed, or to torque enable.
    source: datasheet
    note: As stated in the build brief. Which writes count as a new command is assumed.
  - behaviour: Temperature at or above the limit switches torque off when unloading bit 4 is set.
    source: assumed
    note: Follows the unloading-condition register's naming; the exact threshold behaviour is unchecked.
  - behaviour: With Lock = 1, EEPROM writes take effect but are lost at power-off; with Lock = 0 they persist.
    source: community
    note: LeRobot and rustypot unlock (Lock = 0) before EEPROM writes and lock afterwards.
  - behaviour: Writing goal position while torque is off switches torque on.
    source: assumed
    note: Widely reported for STS servos. Emulated because it is the dangerous case; the daemon never writes a goal to a servo it believes is off.
  - behaviour: Return delay is 2 us per unit, default 0.
    source: assumed
    note: Unit carried over from Dynamixel protocol 1; LeRobot sets it to 0.
  - behaviour: Response level 0 answers only reads and pings, and a write that sets it to 0 is not answered.
    source: assumed
    note: Whether the setting write itself answers is unknown.
  - behaviour: Broadcast ping is answered by every servo in ID order, about 3 ms apart.
    source: assumed
    note: rustypot lists broadcast ping as supported for the STS3215; the spacing is invented.
  - behaviour: Servos sharing an ID answer a broadcast ping at the same moment, so their replies collide into one.
    source: assumed
    note: Same half-duplex model as addressed replies. Identical replies look like one servo, so the daemon probes a new servo's position before numbering it.
  - behaviour: A new servo comes from the factory at ID 1, and the ID at address 5 can be rewritten between an unlock and a lock.
    source: client-derived
    note: LeRobot's motor setup writes ID 5 after clearing Lock 55 and assumes new servos answer at ID 1. Check both in the Stage 8 register dump.
  - behaviour: Sync read (0x82) is answered by each listed servo in list order, back to back.
    source: client-derived
    note: scservo_sdk GroupSyncRead reads one status per listed id in order. Timing between replies is assumed.
  - behaviour: Sync write (0x83) and broadcast instructions are never answered.
    source: client-derived
    note: scservo_sdk txRxPacket returns without reading for the broadcast id.
  - behaviour: An instruction with a bad checksum gets no answer.
    source: assumed
    note: The client sees a timeout.
  - behaviour: An id that is not on the bus stays silent.
    source: client-derived
    note: The conformance script expects ping(9) to fail; scservo_sdk reports a timeout.
  - behaviour: Present load is sign-magnitude with the sign at bit 10; present speed and position at bit 15.
    source: client-derived
    note: rustypot encoding table. Scaling load as per-mille of duty is assumed.
  - behaviour: Goal speed 0 means full speed; any other value rate-limits the internal target in counts per second.
    source: community
    note: BAM's STS3215 model rate-limits the target it feeds the P controller. Using goal speed as that limit is assumed.
  - behaviour: Goals outside the angle limits are clamped to them when max exceeds min.
    source: assumed
    note: Whether the real firmware clamps, refuses, or flags the angle bit is unchecked.
  - behaviour: Supply below 3.5 V resets the servo, which returns with RAM defaults and torque off; EEPROM survives.
    source: assumed
    note: The threshold is invented. Stage 8 step 3 records the real brownout behaviour.
  - behaviour: A half-received instruction is discarded after 50 ms of silence.
    source: assumed
    note: Lets the emulator recover from an unplug mid-packet.
  - behaviour: With no host, a Feetech servo keeps holding its last goal with torque on, because it has no bus watchdog.
    source: assumed
    note: Stage 8 step 3 kills the daemon and records what the servo really does.

dynamixel:
  - behaviour: Protocol 2.0 framing with FF FF FD 00 header, CRC-16 (polynomial 0x8005) and FF FF FD byte stuffing.
    source: client-derived
    note: DynamixelSDK protocol2_packet_handler; the unmodified SDK passes against the emulator.
  - behaviour: The Python DynamixelSDK 4.1.0 never byte-stuffs what it sends; the emulator parses by length, so it accepts those packets.
    source: client-derived
    note: addStuffing rebinds a local list and txPacket discards the result. How real firmware parses such a packet is unknown.
  - behaviour: XL330-M288 control table addresses, sizes, access and initial values.
    source: datasheet
    note: ROBOTIS e-Manual xl330-m288 page, fetched from the emanual repository.
  - behaviour: Ping answers model 1200 and the firmware version.
    source: datasheet
    note: Model from the e-Manual. The firmware version 53 is assumed.
  - behaviour: EEPROM writes are refused with an Access error while torque is on.
    source: datasheet
    note: e-Manual caution on the EEPROM area. The error code is from the protocol 2.0 error list.
  - behaviour: A new XL330 comes from the factory at ID 1, and its ID sits at address 7 in EEPROM with no lock register.
    source: datasheet
    note: e-Manual control table (ID 7, default 1).
  - behaviour: Writes to read-only registers return an Access error.
    source: assumed
    note: Error code chosen from the protocol 2.0 list.
  - behaviour: Goal position outside the position limits returns a Data Limit error.
    source: assumed
    note: The e-Manual gives the range; the exact error code is a guess.
  - behaviour: Bus Watchdog (98) runs only with torque on; when it expires the servo stops, 98 reads -1, goal writes return Data Range errors, and writing 0 clears it.
    source: datasheet
    note: e-Manual Bus Watchdog section. Torque stays on, as its example implies.
  - behaviour: Any instruction addressed to the servo, including a sync read that lists it, feeds the watchdog.
    source: assumed
    note: The e-Manual says all instruction packets count; whether packets for other ids count is unclear.
  - behaviour: A hardware error whose bit is set in Shutdown switches torque off, sets the alert bit 0x80 in every status, and only a reboot lets torque back on.
    source: datasheet
    note: e-Manual Shutdown and Hardware Error Status sections.
  - behaviour: Overload trips after the duty cycle stays at or above 80% for 3 s.
    source: assumed
    note: The e-Manual gives no numbers for overload detection.
  - behaviour: Return delay defaults to 250, in 2 us units.
    source: datasheet
    note: e-Manual Return Delay Time.
  - behaviour: Status return level defaults to 2, so every instruction is answered.
    source: datasheet
    note: e-Manual Status Return Level.
  - behaviour: An instruction with a bad CRC addressed to a servo is answered with CRC error 3.
    source: assumed
    note: The error code is in the protocol 2.0 list; whether a corrupt packet is answered at all is unchecked.
  - behaviour: Goal PWM (100) caps output in position control mode.
    source: assumed
    note: The daemon uses it as its torque cap on Dynamixel. Check at Stage 8; current-based position mode is the alternative.
  - behaviour: Reboot restores RAM defaults and keeps EEPROM.
    source: datasheet
    note: e-Manual Reboot instruction.

plant:
  - behaviour: Friction follows BAM model M6 with the published STS3215 7.4 V and XL330 parameters.
    source: community
    note: Rhoban/bam params feetech_sts3215_7_4V/m6.json and xl330/m6.json, copied exactly.
  - behaviour: The STS3215 firmware runs a P controller on an internal target rate-limited to max velocity.
    source: community
    note: Rhoban/bam bam/feetech/actuator.py, with error gain 0.166 and maximum duty 0.97.
  - behaviour: XL330 duty is error times P gain times 4096 / 2pi / (256 x 885).
    source: community
    note: Rhoban/bam bam/dynamixel/actuator.py, where the 256 divisor is marked as empirically observed.
  - behaviour: Each unit's hidden parameters spread around the fit (kt 5%, resistance 8%, armature 10%, friction 15 to 20%) and carry 0.002 to 0.01 rad of backlash.
    source: assumed
    note: Generated from a seed so units differ but repeat exactly.
  - behaviour: Winding temperature follows I squared R heating with 11 K/W to ambient and 12 J/K of heat capacity.
    source: assumed
    note: Chosen so a stalled STS3215 heats by tens of degrees over minutes.
  - behaviour: The encoder reads 4096 counts per turn on the output shaft.
    source: datasheet
    note: Both servos are 12-bit; putting the encoder after the backlash is assumed.
  - behaviour: The supply sags 0.05 ohm times the total current.
    source: assumed
    note: Stands in for a bench supply and its cable.
  - behaviour: Two servos answering at once pull the bus low, so their bytes AND together.
    source: assumed
    note: Models half-duplex TTL collisions for the duplicate-ID fault.

unitree-g1:
  - behaviour: The robot publishes unitree_hg LowState on rt/lowstate and takes unitree_hg LowCmd on rt/arm_sdk, with 35 motor slots, the 29 G1 joints first in unitree_sdk2 order (legs 0 to 11, waist 12 to 14, left arm 15 to 21, right arm 22 to 28).
    source: client-derived
    note: unitree_sdk2 IDL unitree_hg LowState_ and LowCmd_ and the G1JointIndex enum in its G1 arm examples, as recalled; not re-read in this session. The C layout check in servo-wire pins the struct sizes, 1004 and 2092 bytes.
  - behaviour: Each message carries crc32_core (polynomial 0x04c11db7, seed 0xFFFFFFFF, 32-bit words, MSB first) over the C struct image, every word but the last.
    source: client-derived
    note: unitree_sdk2 crc32_core and the Crc32Core((uint32_t*)&msg, (sizeof(msg) >> 2) - 1) call in its low-level examples; servo-wire's test reproduces it against the same function compiled from C. Padding bytes count as zero.
  - behaviour: An arm_sdk message whose CRC doesn't match is ignored.
    source: assumed
    note: The low-level rt/lowcmd path checks it; whether arm_sdk does is unknown. Emulated so the daemon's CRC is exercised.
  - behaviour: motor_cmd[29].q is the arm_sdk weight, 0 to 1. The arms and waist follow weight times the arm_sdk command plus (1 - weight) times the robot's own controller, blending q, kp and kd; dq and tau scale by the weight.
    source: client-derived
    note: g1_arm7_sdk_dds_example sets kNotUsedJoint's q as the weight and ramps it in and out. The exact blend inside the robot is assumed.
  - behaviour: arm_sdk entries for leg joints and slots past 29 are ignored, and counted.
    source: assumed
    note: The examples only write arm and waist joints; what the robot does with leg entries on arm_sdk is unknown. The count lets tests prove the daemon never writes them.
  - behaviour: With no new arm_sdk message, the robot keeps the last weight and command.
    source: assumed
    note: The conservative case, so the daemon's own hand-back is what releases the arms.
  - behaviour: The robot's own controller holds a standing pose (hips -0.1, knees 0.3, ankles -0.2, elbows 0.97 rad) with kp 150 and kd 2 on legs, 200 and 5 on the waist, 40 and 1 on arms.
    source: assumed
    note: Stands in for the locomotion controller, which balances rather than holds a pose. Gravity and balance aren't modelled.
  - behaviour: Each joint is a PD-driven inertia with viscous and Coulomb friction, torque limits of 88 Nm (legs, waist) and 25 Nm (arms), and URDF joint limits.
    source: assumed
    note: Hidden per-unit inertia (0.08 kg m2, 20% spread), viscous (30%), Coulomb (30%) and gain (10%) come from the seed. Limits are recalled from g1_29dof_rev_1_0.urdf.
  - behaviour: LowState arrives every 2 ms, with motor mode 1, motorstate 0, temperatures of 33 to 38 C and 48 V.
    source: assumed
    note: 500 Hz is the commonly quoted rate; mode, temperature and voltage values are placeholders.
  - behaviour: The loco service answers GetFsmId (api 7001) on rt/api/loco/response with {"data":200} while balancing, and 1 (damping) when not.
    source: assumed
    note: Api id and the JSON shape follow unitree_sdk2's g1 LocoClient as recalled; that 200 is the id the robot reports while its locomotion controller runs is unchecked.
  - behaviour: A motor that fails reports a nonzero motorstate and stops moving.
    source: assumed
    note: Error codes aren't modelled; any nonzero value counts.
  - behaviour: The emulated G1 runs in the daemon's process and talks over a pair of UDP sockets bound to 127.0.0.1, one datagram per sample with a topic byte before the CDR payload, with optional injected latency each way.
    source: assumed
    note: Not RTPS. The real-network path is rustdds behind unlock-real-motors.
ros2-control:
  - behaviour: The robot publishes sensor_msgs/msg/JointState on /joint_states (DDS rt/joint_states, type sensor_msgs::msg::dds_::JointState_) with header, name, position, velocity and effort, one entry per joint.
    source: client-derived
    note: sensor_msgs JointState.msg and joint_state_broadcaster, which publishes every joint's position, velocity and effort interfaces on /joint_states; the rt/ prefix and dds_ type names follow rmw's ROS-to-DDS name mangling.
  - behaviour: JointState arrives every 10 ms.
    source: assumed
    note: 100 Hz is a common controller_manager update_rate in ros2_control examples; real robots set their own.
  - behaviour: The joints in JointState come in an order of their own, a seeded permutation of the controller's order, the same in every message.
    source: client-derived
    note: joint_state_broadcaster orders joints by the hardware interfaces it finds, not by any controller's joint list, so a client has to match by name. The permutation stands in for that.
  - behaviour: A forward_position controller takes std_msgs/msg/Float64MultiArray on its commands topic, one position per joint in the controller's joint order, and holds the last command.
    source: client-derived
    note: forward_command_controller (forward_position_controller) in ros2_controllers, which writes data[i] to joints[i] and keeps the last command.
  - behaviour: A Float64MultiArray whose data length isn't the controller's joint count is ignored.
    source: client-derived
    note: forward_command_controller logs an error and drops a command whose size doesn't match its joints.
  - behaviour: A joint_trajectory controller takes trajectory_msgs/msg/JointTrajectory on its joint_trajectory topic and matches positions to joints by joint_names, in any order.
    source: client-derived
    note: joint_trajectory_controller maps joint_names to its own joints before it uses a trajectory.
  - behaviour: A JointTrajectory that names a joint the controller doesn't have, leaves one of its joints out, or whose time_from_start doesn't increase is ignored.
    source: client-derived
    note: joint_trajectory_controller validates a trajectory before accepting it; with allow_partial_joints_goal false (the default) every joint must be named, and points must be strictly increasing in time.
  - behaviour: A new trajectory starts from the current setpoint and moves linearly between points over time_from_start, then holds the last point.
    source: assumed
    note: joint_trajectory_controller samples with splines (linear only when no velocities are given) and starts from the current state or command; linear interpolation from the setpoint is the simple case.
  - behaviour: Each arm joint is a PD-driven inertia (kp 50, kd 3) with viscous and Coulomb friction and a 10 Nm torque limit, stepped at 1 kHz, starting within 0.2 rad of zero.
    source: assumed
    note: Stands in for whatever hardware interface drives the robot. Hidden per-unit inertia (0.08 kg m2, 20% spread), viscous (30%), Coulomb (30%) and gain (10%) come from the seed, as for the G1.
  - behaviour: A diff_drive controller takes geometry_msgs/msg/Twist on its cmd_vel topic, using linear.x and angular.z.
    source: client-derived
    note: diff_drive_controller in ros2_controllers, cmd_vel_unstamped with use_stamped_vel false (Humble); later releases take TwistStamped on cmd_vel.
  - behaviour: The base ramps toward the commanded velocity at 1 m/s2 and 4 rad/s2, and turns its two wheels (left, right) at (v - w s/2)/r and (v + w s/2)/r, with s 0.160 m and r 0.033 m, times a hidden per-wheel gain within 10%.
    source: assumed
    note: The wheel equations are diff_drive_controller's inverse kinematics; the limits stand in for its linear.x and angular.z acceleration limits, which are off by default. Separation and radius are TurtleBot3 Burger's.
  - behaviour: With no cmd_vel for 0.5 s, the base's command goes to zero.
    source: client-derived
    note: diff_drive_controller's cmd_vel_timeout defaults to 0.5 s.
  - behaviour: Commands it can't decode are ignored and counted, and so are commands it decodes but can't use.
    source: assumed
    note: Controllers log and drop them; the counts let tests prove what the daemon sent.
  - behaviour: The emulated robot runs in the daemon's process behind the same loopback sockets as the G1.
    source: assumed
    note: Not RTPS. The real-network path is rustdds behind unlock-real-motors.
