name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0. Empty keeps the one in package.json.
        type: string
        required: false
      ref:
        description: Commit to build. Empty builds the branch the workflow runs on.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  forge-linux:
    name: forge-linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: forge
      - run: cargo build --locked --release --manifest-path forge/Cargo.toml -p forge-train
      - run: node tools/forge/bundle-linux.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-linux-x64
          if-no-files-found: error
          path: forge/dist-linux-x64/*

  daemon-linux:
    name: daemon-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the static Linux toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: hw
      - name: Build the locked robot daemon
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C linker=musl-gcc -C target-feature=+crt-static
        run: cargo build --locked --release --manifest-path hw/Cargo.toml -p robot-daemon --target "$TARGET"
      - name: Check the daemon needs no shared Linux libraries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="hw/target/$TARGET/release/robot-daemon"
          readelf --program-headers "$binary" > "$RUNNER_TEMP/daemon-program-headers.txt"
          readelf --dynamic "$binary" > "$RUNNER_TEMP/daemon-dynamic.txt"
          if grep -q INTERP "$RUNNER_TEMP/daemon-program-headers.txt" || grep -q NEEDED "$RUNNER_TEMP/daemon-dynamic.txt"; then
            echo 'The robot daemon depends on shared Linux libraries' >&2
            exit 1
          fi
      - name: Check the released daemon keeps real motors locked
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import { lockProblems } from './verify/hw/motorLock.mjs';
          const problems = lockProblems(`hw/target/${process.env.TARGET}/release/robot-daemon`);
          if (problems.length) throw new Error(problems.join('\n'));
          NODE
      - name: Stage the Linux binary and checksum
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          cp "hw/target/$TARGET/release/robot-daemon" "release/robot-daemon-linux-$ARCH"
          cd release
          sha256sum "robot-daemon-linux-$ARCH" > "robot-daemon-linux-$ARCH.sha256"
          sha256sum --check "robot-daemon-linux-$ARCH.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robot-daemon-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/robot-daemon-linux-${{ matrix.arch }}
            release/robot-daemon-linux-${{ matrix.arch }}.sha256

  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npx vite build

      - name: Put the signing certificate in a keychain of our own
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          fail() { echo "$1" >&2; exit 1; }
          [ -n "$CSC_LINK" ] || fail "CSC_LINK is not set, so there is nothing to sign with"
          keychain="$RUNNER_TEMP/basecase-signing.keychain-db"
          password=$(openssl rand -base64 24)
          cert="$RUNNER_TEMP/basecase-signing.p12"
          printf %s "$CSC_LINK" | tr -d '\r\n' | openssl base64 -d -A -out "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application' \
            || fail "the certificate is in no keychain as a Developer ID Application identity"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build the Forge trainer and the robot daemon
        run: rustup toolchain install stable --profile minimal && npm run build:forge && npm run build:daemon

      - run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the app is signed, notarized and whole
        run: |
          shopt -s nullglob
          fail() { echo "$1" >&2; exit 1; }
          apps=(release/*/Basecase.app)
          [ "${#apps[@]}" -eq 1 ] || fail "expected one mac app, found ${#apps[@]}"
          app="${apps[0]}"
          [ "$(lipo -archs "$app/Contents/MacOS/Basecase")" = arm64 ] || fail "the app is not an arm64 build"
          codesign --verify --deep --strict "$app" || fail "the app is not signed properly"
          codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application:' \
            || fail "the app is not signed with a Developer ID Application certificate"
          xcrun stapler validate "$app" || fail "the app carries no notarization ticket"
          [ -f "$app/Contents/Resources/app-update.yml" ] || fail "the app has no app-update.yml, so it can't update"
          for addon in sharing vision; do
            [ -f "$app/Contents/Resources/app/electron/native/$addon/build/Release/$addon.node" ] \
              || fail "the $addon addon wasn't built"
          done

      - name: Check the update files are there
        run: |
          shopt -s nullglob
          fail() { echo "$1" >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          channel=latest
          case "$version" in *-*) channel=${version#*-} && channel=${channel%%.*} ;; esac
          feed="release/$channel-mac.yml"
          [ -f "$feed" ] || fail "$feed is missing"
          [ -f release/Basecase.dmg ] || fail "release/Basecase.dmg is missing, so the latest download link breaks"
          zips=(release/*-mac.zip)
          [ "${#zips[@]}" -eq 1 ] || fail "expected one mac zip, found ${#zips[@]}"
          listed=$(grep -c 'url:.*\.zip' "$feed" || true)
          [ "$listed" -eq 1 ] || fail "$feed lists $listed zips, expected one"

      - name: Drive the packaged app
        run: BASECASE_APP_PATH="$(ls -d "$PWD"/release/mac*/Basecase.app)/Contents/MacOS/Basecase" npm run test:app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/Basecase.dmg
            release/*-mac.zip
            release/*.blockmap
            release/*-mac.yml

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npx vite build

      - name: Build the Forge trainer and the robot daemon
        shell: bash
        run: rustup toolchain install stable --profile minimal && npm run build:forge && npm run build:daemon

      - name: Build the installer, signed when signing is set up
        id: sign
        env:
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          sign=()
          if [ -n "$ACCOUNT" ]; then
            sign=(
              "-c.win.azureSignOptions.codeSigningAccountName=$ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$PROFILE"
              "-c.win.azureSignOptions.endpoint=$ENDPOINT"
              "-c.win.azureSignOptions.publisherName=$PUBLISHER"
            )
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AZURE_SIGNING_ACCOUNT is not set, so the Windows build is unsigned. SmartScreen warns before it runs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          npx electron-builder --win --x64 --publish never "${sign[@]}"

      - name: Check the installer and update files are there
        run: |
          fail() { echo "$1" >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          channel=latest
          case "$version" in *-*) channel=${version#*-} && channel=${channel%%.*} ;; esac
          feed="release/$channel.yml"
          [ -f release/Basecase-Setup.exe ] || fail "release/Basecase-Setup.exe is missing, so the latest download link breaks"
          [ -f "$feed" ] || fail "$feed is missing"
          grep -q 'url: Basecase-Setup.exe' "$feed" || fail "$feed doesn't point at Basecase-Setup.exe"
          [ -f release/win-unpacked/resources/app-update.yml ] || fail "the app has no app-update.yml, so it can't update"

      - name: Check the signature
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          foreach ($file in 'release/Basecase-Setup.exe', 'release/win-unpacked/Basecase.exe') {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "$file is not signed: $($sig.Status)" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/Basecase-Setup.exe
            release/Basecase-Setup.exe.blockmap
            release/latest.yml
            release/beta.yml
            release/alpha.yml
