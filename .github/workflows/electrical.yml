name: Electrical export

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schematic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate KiCad 9.0.6 ERC, PCB pads and DRC fault controls
        if: runner.os == 'Linux'
        run: node tools/electrical/check.mjs --docker
      - name: Validate portable exports and save/reopen determinism
        if: runner.os == 'Windows'
        run: node tools/electrical/check.mjs --export-only
