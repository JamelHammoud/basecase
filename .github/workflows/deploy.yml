name: Deploy

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/landing/**
      - src/design-system/**
      - src/utils/platform/webDemo.ts
      - public/robots/**
      - public/favicon.svg
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/deploy.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [app, site]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || (github.event_name == 'release' && 'app' || 'site') }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || (github.event_name == 'release' && 'app' || 'site') }}

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'push' && vars.LOOP_PAUSED != 'true') ||
      (github.event_name == 'release' && vars.LOOP_PAUSED != 'true' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build the app
        if: env.TARGET == 'app'
        run: npm run build:web && mv dist out

      - name: Build the site
        if: env.TARGET == 'site'
        run: npm run build:site && mv site/dist out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ env.TARGET }}
          path: out
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ env.TARGET }}
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Write the Worker config
        run: |
          if [ "$TARGET" = app ]; then
            cat > wrangler.json <<'JSON'
          {
            "name": "basecase",
            "compatibility_date": "2026-10-01",
            "assets": { "directory": "./dist", "not_found_handling": "single-page-application" },
            "observability": { "enabled": true }
          }
          JSON
          else
            cat > wrangler.json <<'JSON'
          {
            "name": "basecase-site",
            "compatibility_date": "2026-10-01",
            "assets": { "directory": "./dist" }
          }
          JSON
          fi
          cat wrangler.json

      - name: Deploy
        run: npx --yes wrangler@4.159.0 deploy --config wrangler.json --strict
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_MIN_RELEASE_AGE: '3'
          WRANGLER_SEND_METRICS: 'false'

      - name: Check the live site
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Mode: navigate' --retry 5 --retry-delay 5 --retry-all-errors "$1")
            echo "$code $1"
            [ "$code" = 200 ]
          }
          if [ "$TARGET" = app ]; then
            check https://app.basecase.so/c/rover-reach-the-flag
            check https://app.basecase.so/gallery/index.json
          else
            check https://basecase.so/
          fi
