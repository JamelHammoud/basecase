name: Nightly release

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release main if it changed and Check passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAUSED: ${{ vars.LOOP_PAUSED }}
        run: |
          [ "$PAUSED" = true ] && { echo "The loop is paused (LOOP_PAUSED)."; exit 0; }
          last=$(gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          green=$(gh run list -R "$REPO" --workflow check.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$green" ]; then echo "No push to main has passed Check, so no release tonight."; exit 0; fi
          ahead=$(gh api "repos/$REPO/compare/$last...$green" --jq .status)
          if [ "$ahead" != ahead ]; then echo "Nothing that passed Check has merged since $last."; exit 0; fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="$major.$minor.$((patch + 1))"
          echo "Releasing $next ($green, the newest commit on main that passed Check, after $last)."
          gh workflow run release.yml -R "$REPO" --ref main -f version="$next" -f ref="$green" -f release=true
