[package]
name = "forge-wgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = "1"
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12", "vulkan"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
