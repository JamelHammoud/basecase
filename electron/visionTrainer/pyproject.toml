[project]
name = "basecase-vision-trainer"
version = "0.1.0"
description = "Local task-specific Basecase vision training"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics==8.3.221",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "numpy==2.2.6",
  "onnx==1.23.2",
  "onnxruntime==1.23.2",
  "pillow==13.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
