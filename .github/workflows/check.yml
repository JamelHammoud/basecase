name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - run: npx vite build --mode web --outDir dist-web
      - run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm audit --audit-level=high

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build the Forge trainer and the robot daemon
        run: rustup toolchain install stable --profile minimal && npm run build:forge && npm run build:daemon
      - name: Package the app, unsigned
        run: npx electron-builder ${{ matrix.target }} --dir --publish never -c.mac.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Drive the packaged app
        if: runner.os == 'macOS'
        run: npm run test:app
      - name: Compile parts in the packaged app's kernel sandbox
        if: runner.os == 'Windows'
        run: |
          BASECASE_KERNEL_SELFTEST="$RUNNER_TEMP/kernel.json" BASECASE_USER_DATA="$RUNNER_TEMP/user-data" STUDIO_AGENT_OFFLINE=1 timeout 300 release/win-unpacked/Basecase.exe
          cat "$RUNNER_TEMP/kernel.json"
      - name: Convert CAD files in the packaged app's sandbox
        if: runner.os == 'Windows'
        run: npx vitest run --config vitest.app.config.ts e2e/app/cadImportSandbox.app.test.ts

  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No commit credits a model or tool
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          base="${RANGE%%..*}"
          head="${RANGE#*..}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$head~1"
          node tools/check-credit.mjs "$base..$head"

  check:
    if: always()
    needs: [test, app, credit]
    runs-on: ubuntu-latest
    steps:
      - name: Pass only when every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Results: $RESULTS"
          [ "$(wc -w <<< "$RESULTS")" -eq 3 ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
