name: Deploy Web

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy. Empty uses the selected workflow branch.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || !github.event.release.prerelease
    name: Deploy ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: basecase.so
            build: build:site
            config: site/wrangler.jsonc
          - domain: app.basecase.so
            build: build:web
            config: wrangler.jsonc
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository Actions secrets.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build ${{ matrix.domain }}
        env:
          BUILD_SCRIPT: ${{ matrix.build }}
        run: npm run "$BUILD_SCRIPT"

      - name: Deploy ${{ matrix.domain }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          command: deploy --config ${{ matrix.config }}
